<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090D0E">
<title>Vistoria de entrada, Impacto Centro Automotivo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#EBEFF1;--card:#FFFFFF;--soft:#F3F6F7;--ink:#16222B;--muted:#5A6A75;--line:#D0D8DD;
  --brand:#E8741C;--brand-ink:#111111;--danger:#CF3027;--ok:#2A7A4A;
  --f-head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10181D;--card:#18232A;--soft:#1E2B33;--ink:#E8EEF1;--muted:#95A4AE;--line:#2D3B44;
    --brand:#E8741C;--brand-ink:#111111;--danger:#FF6E65;--ok:#2E8B57;
  }
}
:root[data-theme="dark"]{
  --bg:#10181D;--card:#18232A;--soft:#1E2B33;--ink:#E8EEF1;--muted:#95A4AE;--line:#2D3B44;
  --brand:#E8741C;--brand-ink:#111111;--danger:#FF6E65;--ok:#2E8B57;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);padding-bottom:104px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:.01em}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#090D0E;color:#fff;padding:8px 16px 6px}
.top .in{max-width:640px;margin:0 auto}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .logo{height:58px;width:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top .btn{background:#1B2124;border-color:#3A4348;color:#fff}
.top .btn.pri{background:var(--brand);border-color:var(--brand);color:#111}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.stp{background:none;border:0;padding:4px 0 2px;text-align:left;color:#A5AFB4;font:500 13px var(--f-body)}
.stp i{display:block;height:5px;border-radius:3px;background:#39434A;margin-bottom:5px}
.stp.cur{color:#fff;font-weight:600}
.stp.cur i{background:var(--brand)}
.stp.done i{background:#3FAE6E}
.top :focus-visible{outline-color:#fff}
.warn{margin:8px 16px 0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--danger);font-size:14px}

main{padding:8px 16px 0;max-width:640px;margin:0 auto}
h2{font-size:32px;line-height:1.05;margin:10px 0 4px}
h3{font-size:22px}
.lead{color:var(--muted);margin:0 0 16px}

/* campos */
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
input[type=text],input[type=tel],input:not([type]),textarea{
  width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.plate{font-family:var(--f-head);font-size:30px!important;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 15px var(--f-body)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}

/* botões */
.btn{min-height:50px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 16px var(--f-body);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:8px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);text-decoration:underline}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.4}
.block{display:flex;width:100%;margin-bottom:10px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
#bar .btn{flex:1}
#bar .btn.pri{flex:2}

/* carro */
.carbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;text-align:center}
.carbox .end{font-size:14px;color:var(--muted);font-weight:500}
svg.car{display:block;margin:4px auto;width:100%;max-width:250px;aspect-ratio:1/2;touch-action:manipulation;cursor:crosshair}
.car .body{fill:var(--soft);stroke:var(--ink);stroke-width:2}
.car .glass{fill:var(--line);stroke:var(--ink);stroke-width:1.2}
.car .tire{fill:var(--ink)}
.car .ln{fill:none;stroke:var(--muted);stroke-width:1.2}
.car .axis{stroke:var(--line);stroke-width:1;stroke-dasharray:4 5}
.pin{cursor:pointer}
.pin circle{fill:var(--danger);stroke:#fff;stroke-width:2.5}
.pin text{fill:#fff;font:700 15px var(--f-head);text-anchor:middle}
.chip.sm{min-height:40px;padding:0 12px;font-size:14px}
.chip.on.av{background:var(--danger);border-color:var(--danger);color:#fff}
.avrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.avrow .thumb{width:40px;height:40px;object-fit:cover;border-radius:8px}
.plist{margin:14px 0 0;padding:0;list-style:none}
.plist li{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
.plist .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;font:700 17px var(--f-head)}
.plist .t{flex:1;min-width:0}
.plist .t small{display:block;color:var(--muted)}
.plist img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin-top:12px}
.check input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--brand)}

/* checklist */
.grp{margin-bottom:22px}
.grp .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item b{display:block;font-weight:500;margin-bottom:7px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 14px var(--f-body)}
.seg button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-v="def"]{background:var(--danger);border-color:var(--danger)}
.seg button.on[data-v="na"]{background:var(--muted);border-color:var(--muted);color:var(--card)}
.item .note{margin-top:8px}

/* fotos */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ph{position:relative;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font:600 14px var(--f-body);overflow:hidden;padding:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.has{border:2px solid var(--ok)}
.ph .lb{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;padding:4px 8px;font-size:13px;text-align:left}
.ph .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}

/* assinatura e pendências */
canvas.sig{width:100%;height:180px;background:#fff;border:1.5px solid var(--line);border-radius:12px;touch-action:none;display:block}
.pend{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin-bottom:14px}
.pend.ok{border-color:var(--ok)}
.pend ul{margin:6px 0 0;padding-left:20px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats strong{display:block;font:700 30px/1 var(--f-head)}
.stats span{font-size:13px;color:var(--muted)}

/* folha (relatório) */
.rep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;font-size:15px}
.repbrand{background:#090D0E;border-radius:10px;padding:8px;text-align:center;margin-bottom:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.repbrand img{height:64px;width:auto;display:inline-block;vertical-align:top}
.repfoot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.rep h2{font-size:28px;margin:0 0 2px}
.rep h3{font-size:20px;margin:16px 0 6px}
.rep table{width:100%;border-collapse:collapse}
.rep td{padding:4px 0;vertical-align:top}
.rep td:first-child{color:var(--muted);width:34%;padding-right:8px}
.rep ol,.rep ul{margin:0;padding-left:20px}
.rep li{margin-bottom:4px}
.rphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.rep .sigimg{max-width:260px;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.done-banner{border:1.5px solid var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--card)}
.saved{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.saved .pl{font:700 26px/1 var(--f-head);letter-spacing:.08em}
.saved small{display:block;color:var(--muted);margin-top:4px}

/* folha modal e aviso */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,26,.55);display:flex;align-items:flex-end}
#sheet .panel{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#sheet .panel h3{font-size:26px;margin-bottom:12px}
#sheet .acts{display:flex;gap:10px;margin-top:16px}
#sheet .acts .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:90%;text-align:center}

#printArea{display:none;--ink:#000;--muted:#444;--line:#bbb;--card:#fff;--danger:#b00;background:#fff;color:#000}
@media print{
  body{background:#fff;padding:0}
  :root{padding:0}
  .top,main,#bar,#sheet,#toast,.warn{display:none!important}
  #printArea{display:block}
  #printArea .rep{border:0;padding:0}
  .rphotos{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .stp i{transition:background .2s}
}
</style>
</head>

/* ---------- armazenamento (IndexedDB, com plano B em memória) ---------- */
const Store = (function(){
  let dbp=null, ok=true;
  const mem = {draft:null, records:new Map()};
  function open(){
    if(!dbp) dbp = new Promise((res,rej)=>{
      try{
        const r = indexedDB.open('vistoria-oficina',1);
        r.onupgradeneeded = ()=>{ const d=r.result; d.createObjectStore('kv'); d.createObjectStore('records',{keyPath:'id'}); };
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>rej(r.error);
        r.onblocked = ()=>rej(new Error('blocked'));
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  function req(store,mode,fn){
    return open().then(db=>new Promise((res,rej)=>{
      const t = db.transaction(store,mode);
      const rq = fn(t.objectStore(store));
      t.oncomplete = ()=>res(rq ? rq.result : undefined);
      t.onerror = ()=>rej(t.error);
      t.onabort = ()=>rej(t.error);
    }));
  }
  async function safe(fn,fb){ try{ return await fn(); }catch(e){ ok=false; return fb(); } }
  return {
    isOk: ()=>ok,
    getDraft: ()=>safe(()=>req('kv','readonly',s=>s.get('draft')), ()=>mem.draft),
    setDraft: d=>{ mem.draft=d; return safe(()=>req('kv','readwrite',s=>s.put(d,'draft')), ()=>{}); },
    clearDraft: ()=>{ mem.draft=null; return safe(()=>req('kv','readwrite',s=>s.delete('draft')), ()=>{}); },
    list: ()=>safe(()=>req('records','readonly',s=>s.getAll()), ()=>Array.from(mem.records.values())),
    put: r=>{ mem.records.set(r.id,r); return safe(()=>req('records','readwrite',s=>s.put(r)), ()=>{}); },
    del: id=>{ mem.records.delete(id); return safe(()=>req('records','readwrite',s=>s.delete(id)), ()=>{}); }
  };
})();

/* ---------- fotos ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const M=1100, k=Math.min(1, M/Math.max(img.width,img.height));
        const w=Math.round(img.width*k), h=Math.round(img.height*k);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
        const fs=Math.max(13, Math.round(w*0.03)), pad=Math.round(fs*0.5);
        const txt = fmt(Date.now()) + (S.v.placa ? '   '+S.v.placa : '');
        x.font = '600 '+fs+'px sans-serif';
        const tw = x.measureText(txt).width;
        x.fillStyle='rgba(0,0,0,.62)'; x.fillRect(0,h-fs-pad*2,tw+pad*2,fs+pad*2);
        x.fillStyle='#fff'; x.textBaseline='middle'; x.fillText(txt,pad,h-fs/2-pad);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg',0.68));
      }catch(e){ rej(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function pickPhoto(cb){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; i.setAttribute('capture','environment'); i.style.display='none';
  i.addEventListener('change', async ()=>{
    const f=i.files && i.files[0]; i.remove();
    if(!f) return;
    try{ cb(await compress(f)); }catch(e){ toast('Não foi possível ler a foto. Tente de novo.'); }
  });
  document.body.appendChild(i); i.click();
}

  }));
  $$('[data-allok]').forEach(b=>b.addEventListener('click',()=>{
    GROUPS[+b.dataset.allok].items.forEach(([k])=>{ if(!(S.items[k]&&S.items[k].s)){ S.items[k]={s:'ok',n:''}; paintRow(k); } });
    $('#cnt').textContent=markedCount(); persist(); paintStepper();
  }));
  $('[data-k="valores"]').addEventListener('input',e=>{ S.v.valores=e.target.value; persist(); });
}

/* etapa 4 */
function s3(){
  const falta=SLOTS.filter(([k])=>!S.fotos[k]).length;
  return ''+
  '<h2>Fotos do carro</h2>'+
  '<p class="lead">'+(falta? falta+' de 5 fotos obrigatórias ainda faltam. ' : 'As 5 fotos obrigatórias estão prontas. ')+'Cada foto sai com data e hora carimbadas.</p>'+
  '<div class="pgrid">'+SLOTS.map(([k,l])=>
    '<button class="ph '+(S.fotos[k]?'has':'')+'" data-slot="'+k+'">'+(S.fotos[k]?'<img src="'+S.fotos[k]+'" alt="'+l+'"><span class="lb">'+l+'</span>':ICON_CAM+'<span>'+l+'</span>')+'</button>').join('')+
  '</div>'+
  (S.extras.length? '<h3 style="margin:8px 0">Outras fotos</h3><div class="pgrid">'+S.extras.map((d,i)=>
    '<div class="ph has"><img src="'+d+'" alt="Outra foto '+(i+1)+'"><button class="x" data-xdel="'+i+'" aria-label="Remover foto">×</button></div>').join('')+'</div>' : '')+
  '<button class="btn block" id="addExtra">Adicionar outra foto</button>';
}
function b3(){
  $$('[data-slot]').forEach(b=>b.addEventListener('click',()=>pickPhoto(d=>{ S.fotos[b.dataset.slot]=d; persist(); renderStep(true); })));
  $$('[data-xdel]').forEach(b=>b.addEventListener('click',()=>{ S.extras.splice(+b.dataset.xdel,1); persist(); renderStep(true); }));
  $('#addExtra').onclick=()=>pickPhoto(d=>{ S.extras.push(d); persist(); renderStep(true); });
}

/* etapa 5 */
function s4(){
  const defs=ALL.filter(([k])=>S.items[k]&&S.items[k].s==='def').length;
  return ''+
  '<h2>Conferência e assinatura</h2>'+
  '<p class="lead">Mostre a tela ao cliente, confira o que foi registrado e peça a assinatura.</p>'+
  '<div class="stats"><div><strong>'+avCount()+'</strong><span>avarias externas</span></div><div><strong>'+defs+'</strong><span>itens com defeito</span></div><div><strong>'+(SLOTS.filter(([k])=>S.fotos[k]).length+S.extras.length)+'</strong><span>fotos</span></div></div>'+
  '<div class="pend" id="pend"></div>'+
  '<label class="check" style="margin-top:0"><input type="checkbox" id="ciente" '+(S.ciente?'checked':'')+'><span>O cliente conferiu as avarias e os itens registrados e está ciente de que já existiam na entrada. Nenhum serviço será feito sem orçamento aprovado.</span></label>'+
  '<div class="fld" style="margin-top:14px"><span>Assinatura do cliente</span><canvas class="sig" id="sig" aria-label="Área de assinatura"></canvas>'+
  '<button class="btn sm" id="sigClear" style="margin-top:8px">Limpar assinatura</button></div>';
}
function paintPend(){
  const el=$('#pend'); if(!el) return;
  const p=pendencias(S);
  el.classList.toggle('ok',!p.length);
  el.innerHTML = p.length ? '<b>Antes de finalizar, falta:</b><ul>'+p.map(x=>'<li>'+x+'</li>').join('')+'</ul>' : '<b>Tudo pronto para finalizar.</b>';
}
function b4(){
  paintPend();
  $('#ciente').addEventListener('change',e=>{ S.ciente=e.target.checked; persist(); paintPend(); paintStepper(); });
  const c=$('#sig'), dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  c.width=w*dpr; c.height=h*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#111'; x.fillStyle='#fff'; x.fillRect(0,h*0,w,h);
  if(S.sig){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,w,h); im.src=S.sig; }
  let drawing=false,last=null;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  c.addEventListener('pointerdown',e=>{ drawing=true; last=pos(e); try{c.setPointerCapture(e.pointerId);}catch(_){} x.beginPath(); x.moveTo(last[0],last[1]); x.lineTo(last[0]+.1,last[1]+.1); x.stroke(); e.preventDefault(); });
  c.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); x.beginPath(); x.moveTo(last[0],last[1]); x.lineTo(p[0],p[1]); x.stroke(); last=p; });
  const end=()=>{ if(!drawing) return; drawing=false; S.sig=c.toDataURL('image/png'); persist(); paintPend(); paintStepper(); };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
  $('#sigClear').onclick=()=>{ x.fillStyle='#fff'; x.fillRect(0,0,w,h); S.sig=null; persist(); paintPend(); paintStepper(); };
}

/* ---------- finalizar ---------- */
async function finish(){
  const p=pendencias(S);
  if(p.length){ toast('Falta: '+p[0].toLowerCase()); return; }
  const rec=JSON.parse(JSON.stringify(S)); rec.finished=Date.now();
  await Store.put(rec); await Store.clearDraft();
  detailRec=rec; justSaved=true; view='detail'; S=fresh(); render();
}

/* ---------- relatório ---------- */
function resumoTexto(r){
  const v=r.v, L=[];
  L.push('*'+SHOP.nome.toUpperCase()+'*'); L.push('*VISTORIA DE ENTRADA*'); L.push(fmt(r.finished||r.created)); L.push('');
  L.push('Cliente: '+v.nome);
  const car=[v.modelo,v.ano,v.cor].filter(Boolean).join(' '); if(car) L.push('Veículo: '+car);
  L.push('Placa: '+v.placa);
  if(v.os) L.push('OS: '+v.os);
  if(v.mec) L.push('Mecânico: '+v.mec);
  if(v.km) L.push('Km: '+v.km);
  if(v.comb) L.push('Combustível: '+v.comb);
  if(v.queixa) L.push('Queixa: '+v.queixa);
  L.push('');
  if(avCount(r)){
    L.push('*Avarias que já existiam ('+avCount(r)+')*');
    avLines(r).forEach((t,i)=>L.push((i+1)+'. '+t));
  } else L.push('*Sem avarias externas*');
  const defs=ALL.filter(([k])=>r.items[k]&&r.items[k].s==='def');
  if(defs.length){ L.push(''); L.push('*Itens com defeito*'); defs.forEach(([k,l])=>L.push('- '+l+(r.items[k].n?': '+r.items[k].n:''))); }
  const nas=ALL.filter(([k])=>r.items[k]&&r.items[k].s==='na');
  if(nas.length){ L.push(''); L.push('*Não possui:* '+nas.map(a=>a[1]).join(', ')); }
  if(r.v.valores){ L.push(''); L.push('*Objetos no carro:* '+r.v.valores); }
  L.push('');
  L.push('Cliente ciente das avarias acima e assinou na entrada. Nenhum serviço será feito sem orçamento aprovado.');
  L.push(''); L.push(SHOP.nome+', '+SHOP.tel);
  return L.join('\n');
}
function reportHTML(r){
  const v=r.v;
  const rows=[['Cliente',v.nome],['Telefone',v.tel],['Placa',v.placa],['Nº da OS',v.os],['Mecânico',v.mec],['Veículo',[v.modelo,v.ano,v.cor].filter(Boolean).join(' ')],['Km',v.km],['Combustível',v.comb],['Queixa',v.queixa]].filter(x=>x[1]);
  const defs=ALL.filter(([k])=>r.items[k]&&r.items[k].s==='def');
  const nas=ALL.filter(([k])=>r.items[k]&&r.items[k].s==='na');
  const oks=ALL.filter(([k])=>r.items[k]&&r.items[k].s==='ok').length;
  const avFotos=Object.keys(r.av||{}).filter(k=>r.av[k].foto).map(k=>r.av[k].foto).concat(r.pins.filter(p=>p.foto).map(p=>p.foto));
  const fotos=SLOTS.filter(([k])=>r.fotos[k]).map(([k,l])=>r.fotos[k]).concat(avFotos).concat(r.extras||[]);
  return '<div class="rep">'+
    '<div class="repbrand"><img src="'+LOGO()+'" alt="'+esc(SHOP.nome)+'"></div>'+
    '<h2>Vistoria de entrada</h2><div style="color:var(--muted)">'+fmt(r.finished||r.created)+'</div>'+
    '<h3>Cliente e veículo</h3><table>'+rows.map(x=>'<tr><td>'+x[0]+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</table>'+
    '<h3>Avarias que já existiam</h3>'+
    (avCount(r)? '<ol>'+avLines(r).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>' : '<p style="margin:0">Nenhuma avaria externa.</p>')+
    '<h3>Itens</h3>'+
    '<p style="margin:0 0 6px">'+oks+' itens conferidos sem problema.</p>'+
    (defs.length? '<b>Com defeito</b><ul>'+defs.map(([k,l])=>'<li>'+esc(l)+(r.items[k].n?': '+esc(r.items[k].n):'')+'</li>').join('')+'</ul>' : '')+
    (nas.length? '<p style="margin:8px 0 0"><b>Não possui:</b> '+nas.map(a=>esc(a[1])).join(', ')+'</p>' : '')+
    (v.valores? '<h3>Objetos deixados no carro</h3><p style="margin:0">'+esc(v.valores)+'</p>' : '')+
    (fotos.length? '<h3>Fotos</h3><div class="rphotos">'+fotos.map(d=>'<img src="'+d+'" alt="">').join('')+'</div>' : '')+
    '<h3>Ciência do cliente</h3><p style="margin:0 0 8px">O cliente conferiu as avarias e os itens acima e está ciente de que já existiam na entrada. Nenhum serviço será feito sem orçamento aprovado.</p>'+
    (r.sig? '<img class="sigimg" src="'+r.sig+'" alt="Assinatura do cliente">' : '')+
    '<div class="repfoot">'+esc(SHOP.nome)+', WhatsApp '+esc(SHOP.tel)+', Instagram '+esc(SHOP.insta)+'</div>'+
  '</div>';
}
function waLink(r){
  const d=(r.v.tel||'').replace(/\D/g,'');
  const num = d ? (d.length<=11 ? '55'+d : d) : '';
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(resumoTexto(r));
}
function dataToFile(d,name){
  const b=atob(d.split(',')[1]), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
  return new File([u],name,{type:'image/jpeg'});
}
async function compartilhar(r){
  const txt=resumoTexto(r), title='Vistoria '+r.v.placa;
  const files=[];
  try{
    SLOTS.forEach(([k])=>{ if(r.fotos[k]) files.push(dataToFile(r.fotos[k],r.v.placa+'-'+k+'.jpg')); });
    r.pins.forEach((p,i)=>{ if(p.foto) files.push(dataToFile(p.foto,r.v.placa+'-avaria'+(i+1)+'.jpg')); });
    Object.keys(r.av||{}).forEach(k=>{ if(r.av[k].foto) files.push(dataToFile(r.av[k].foto,r.v.placa+'-'+k+'.jpg')); });
  }catch(e){}
  try{
    if(navigator.share){
      if(files.length && navigator.canShare && navigator.canShare({files})) await navigator.share({title,text:txt,files:files.slice(0,10)});
      else await navigator.share({title,text:txt});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(txt); toast('Resumo copiado. Cole onde quiser.'); }
  catch(e){ toast('Compartilhar não funciona aqui. Use o botão do WhatsApp.'); }
}
function imprimir(r){
  $('#printArea').innerHTML=reportHTML(r);
  try{ window.print(); }catch(e){ toast('Use o menu do navegador para imprimir.'); }
}

/* ---------- telas: salvas e detalhe ---------- */
async function renderSaved(){
  const app=$('#app');
  app.innerHTML='<h2>Vistorias salvas</h2><p class="lead">Carregando…</p>';
  const list=(await Store.list()||[]).sort((a,b)=>(b.finished||0)-(a.finished||0));
  renderTop();
  app.innerHTML='<h2>Vistorias salvas</h2><p class="lead">Ficam guardadas só neste aparelho. Envie cada uma por WhatsApp para ter cópia fora dele.</p>'+
    (list.length ? list.map(r=>'<button class="saved" data-id="'+r.id+'"><span class="pl">'+esc(r.v.placa||'Sem placa')+'</span><small>'+esc(r.v.nome)+'</small><small>'+fmt(r.finished||r.created)+', '+avCount(r)+(avCount(r)===1?' avaria':' avarias')+'</small></button>').join('')
    : '<p>Nenhuma vistoria salva ainda. Quando você finalizar uma, ela aparece aqui.</p>');
  $$('.saved').forEach(b=>b.addEventListener('click',()=>{ detailRec=list.find(r=>r.id===b.dataset.id); justSaved=false; view='detail'; render(); }));
}
function renderDetail(){
  const r=detailRec, app=$('#app');
  if(!r){ view='saved'; return render(); }
  app.innerHTML=
    (justSaved? '<div class="done-banner"><b>Vistoria finalizada e salva.</b><br>Envie agora para o cliente ficar com uma cópia.</div>' : '')+
    '<a class="btn pri block" id="wa" href="'+waLink(r)+'" target="_blank" rel="noopener">Enviar por WhatsApp</a>'+
    '<button class="btn block" id="share">Compartilhar com fotos</button>'+
    '<button class="btn block" id="print">Imprimir ou salvar em PDF</button>'+
    reportHTML(r)+
    '<button class="btn block" id="newV">Nova vistoria</button>'+
    '<button class="btn ghost block" id="delV">Excluir esta vistoria</button>';
  $('#share').onclick=()=>compartilhar(r);
  $('#print').onclick=()=>imprimir(r);
  $('#newV').onclick=()=>{ view='form'; render(); };
  let armed=false;
  $('#delV').onclick=async()=>{
    if(!armed){ armed=true; $('#delV').textContent='Toque de novo para excluir'; $('#delV').classList.add('danger'); setTimeout(()=>{ armed=false; const d=$('#delV'); if(d){ d.textContent='Excluir esta vistoria'; d.classList.remove('danger'); } },3500); return; }
    await Store.del(r.id); detailRec=null; view='saved'; render();
  };
}

/* ---------- início ---------- */
(async function init(){
  try{ const d=await Store.getDraft(); if(d && d.v) S=Object.assign(fresh(),d); }catch(e){}
  render();
})();
})();
</script>
